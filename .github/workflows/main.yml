name: Build MaxMuse

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Resampler simulation + LSL loopback tests on the three OSes
  # ─────────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # needs external/liblsl
      - name: Configure
        run: cmake -S test -B build-test -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-test --config Release --parallel
      - name: Run
        # the LSL loopback test reports "skipped" if the runner blocks local multicast
        run: ctest --test-dir build-test -C Release --output-on-failure

  sanitizers:
    name: Tests (${{ matrix.sanitizer }} sanitizer)
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ thread, address ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Allow ThreadSanitizer on high-entropy ASLR kernels
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build and run
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S test -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.sanitizer }}" \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
          cmake --build build-san --parallel
          ctest --test-dir build-san --output-on-failure

  # ─────────────────────────────────────────────────────────────
  # macOS: one universal (arm64 + x86_64) build, no lipo step
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: Build (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0            # tags, for min-api's version scripts
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Verify universal, self-contained and signed
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(externals/*.mxo)
          [ ${#bundles[@]} -gt 0 ] || { echo "::error::no .mxo was produced"; exit 1; }
          for b in "${bundles[@]}"; do
            bin="$b/Contents/MacOS/$(basename "$b" .mxo)"
            echo "── $b"
            lipo -info "$bin"
            lipo "$bin" -verify_arch arm64 x86_64
            otool -l "$bin" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" || true
            if otool -L "$bin" | grep -qi lsl; then
              echo "::error::$b links liblsl dynamically"; otool -L "$bin"; exit 1
            fi
            codesign --force --deep --sign - "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
          ditto -c -k --keepParent externals macos-externals.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos-externals.zip
            package-info.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Windows
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Verify no lsl.dll / VC runtime dependency
        shell: pwsh
        run: |
          $files = Get-ChildItem externals -Filter *.mxe64
          if ($files.Count -eq 0) { throw "no .mxe64 was produced" }
          foreach ($f in $files) {
            $deps = dumpbin /nologo /dependents $f.FullName
            $deps
            if ($deps -match '(?i)lsl|vcruntime|msvcp') { throw "$($f.Name) has an unwanted DLL dependency" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: externals/*.mxe64
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Max package (+ GitHub release on v* tags)
  # ─────────────────────────────────────────────────────────────
  package:
    name: Package
    needs: [ test, build-macos, build-windows ]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Check the tag matches package-info.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python3 -c "import json;print(json.load(open('macos/package-info.json'))['version'])")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but package-info.json.in says $have"; exit 1; }
      - name: Assemble the Max package
        run: |
          set -euo pipefail
          mkdir -p MaxMuse
          ditto -x -k macos/macos-externals.zip MaxMuse
          cp windows/*.mxe64 MaxMuse/externals/
          cp -R help docs icon.png License.md ReadMe.md MaxMuse/
          cp macos/package-info.json MaxMuse/
          ditto -c -k --keepParent MaxMuse MaxMuse.zip
          unzip -l MaxMuse.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MaxMuse-package
          path: MaxMuse.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MaxMuse.zip
          generate_release_notes: true
