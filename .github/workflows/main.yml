name: Build MaxMuse Externals

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Windows build
  # ──────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Windows externals
        uses: actions/upload-artifact@v4
        with:
          name: MaxMuse-windows
          # .mxe64 files are the Windows Max externals produced by the build
          path: |
            externals/**/*.mxe64
            build/**/*.mxe64
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # macOS build
  # ──────────────────────────────────────────────
  build-macos-x86:
    name: Build (macOS x86_64)
    runs-on: macos-13   # last Intel-based GitHub runner

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build
        run: cmake --build build --config Release

      - name: Collect x86_64 externals
        run: |
          mkdir -p staging/x86_64
          find build -name "*.mxo" | while read f; do
            name=$(basename "$f")
            cp -R "$f" "staging/x86_64/$name"
          done

      - name: Upload x86_64 slice
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-slice
          path: staging/x86_64/

  build-macos-arm:
    name: Build (macOS arm64)
    runs-on: macos-latest   # ARM runner

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --config Release

      - name: Collect arm64 externals
        run: |
          mkdir -p staging/arm64
          find build -name "*.mxo" | while read f; do
            name=$(basename "$f")
            cp -R "$f" "staging/arm64/$name"
          done

      - name: Upload arm64 slice
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-slice
          path: staging/arm64/

  build-macos-universal:
    name: Lipo universal macOS externals
    runs-on: macos-latest
    needs: [ build-macos-x86, build-macos-arm ]

    steps:
      - name: Download x86_64 slice
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64-slice
          path: slices/x86_64/

      - name: Download arm64 slice
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-slice
          path: slices/arm64/

      - name: Create universal .mxo bundles with lipo
        run: |
          mkdir -p universal
          for arm_bundle in slices/arm64/*.mxo; do
            name=$(basename "$arm_bundle")
            x86_bundle="slices/x86_64/$name"

            if [ ! -d "$x86_bundle" ]; then
              echo "WARNING: no x86_64 counterpart for $name — copying arm64 only"
              cp -R "$arm_bundle" "universal/$name"
              continue
            fi

            # Copy bundle structure from arm64, then lipo the binary inside
            cp -R "$arm_bundle" "universal/$name"

            # The executable sits at Contents/MacOS/<name-without-.mxo>
            bin="${name%.mxo}"
            arm_bin="$arm_bundle/Contents/MacOS/$bin"
            x86_bin="$x86_bundle/Contents/MacOS/$bin"
            out_bin="universal/$name/Contents/MacOS/$bin"

            if [ -f "$arm_bin" ] && [ -f "$x86_bin" ]; then
              lipo -create "$x86_bin" "$arm_bin" -output "$out_bin"
            else
              echo "WARNING: could not find binary inside $name — bundle copied as-is"
            fi
          done

      - name: Ad-hoc codesign universal externals
        run: |
          find universal -name "*.mxo" -exec codesign --force --deep -s - {} \;

      - name: Upload universal macOS externals
        uses: actions/upload-artifact@v4
        with:
          name: MaxMuse-macos-universal
          path: universal/
          if-no-files-found: warn