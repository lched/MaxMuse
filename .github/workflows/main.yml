name: Build MaxMuse Externals

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # Windows build
  # ──────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Windows externals
        uses: actions/upload-artifact@v4
        with:
          name: MaxMuse-windows
          # .mxe64 files are the Windows Max externals produced by the build
          path: |
            externals/**/*.mxe64
            build/**/*.mxe64
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # macOS build
  # ──────────────────────────────────────────────
  build-macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Xcode generator)
        run: cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Ad-hoc codesign externals (required on Apple Silicon)
        run: |
          find build -name "*.mxo" -exec codesign --force --deep -s - {} \;

      - name: Upload macOS externals
        uses: actions/upload-artifact@v4
        with:
          name: MaxMuse-macos
          path: |
            externals/**/*.mxo
            build/**/*.mxo
          if-no-files-found: warn